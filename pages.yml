# Deploys TicketPilot to GitHub Pages on every push to the main branch.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

# Permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel a deployment that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Copy only the site files (index.html stays at the root of the artifact)
      # and make sure .nojekyll is present, because hidden files can be skipped by some actions.
      - name: Prepare site folder
        run: |
          mkdir _site
          cp index.html 404.html README.md _site/
          cp -r css js assets _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
